name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Este repo es el perfil de la organizacion: no tiene package.json ni
      # lockfile. Los pasos de Node solo corren si hay proyecto real.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "Sin package.json — repo de perfil de organización, nada que instalar."
          fi

      - name: Lint
        run: if [ -f package.json ]; then npm run lint --if-present; else echo "skip: sin package.json"; fi

      - name: Type check
        run: if [ -f package.json ]; then npm run typecheck --if-present; else echo "skip: sin package.json"; fi

      - name: Test
        run: if [ -f package.json ]; then npm test --if-present; else echo "skip: sin package.json"; fi
